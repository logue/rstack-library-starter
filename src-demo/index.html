<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta content="light dark" name="color-scheme" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
    <title>Hello world!</title>
  </head>
  <body>
    <main class="container">
      <h1>Hello world!</h1>
      <input aria-label="Input" id="input" placeholder="Input" type="number" />
      <input
        aria-label="Output"
        id="output"
        placeholder="Output"
        readonly
        type="number"
      />
    </main>
  </body>
</html>
